# options specified here will apply to all posts in this folder

# freeze computational output
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: true

# Enable banner style title blocks
title-block-banner: true

# Alles in deze map krijgt automatisch deze instellingen mee:
citation:
  type: webpage

format:
  html:
    include-after-body: [] # Overschrijft eventuele automatische appendices
    citations-hover: false
    # Mocht Quarto de appendix alsnog tonen, dwingen we het hier af:
    appendix-style: none