project:
  type: website
  title: "The Open Inference Lab"
  output-dir: docs
  render:
    - "*.qmd"
    - "!drafts/"


website:
  description: "Opening up (Bayesian) models, multivariate inference, statistical decision-making, and more"
  site-url: https://xynthiakavelaars.github.io/OpenInferenceLab  # you must change this appropriately for RSS feeds to work properly
  title: "The Open Inference Lab"

  navbar:
    left:
      - href: index.qmd
        text: "Home"
      - href: posts.qmd
        text: "Blog posts"
      - text: "About"
        menu:  
        - href: about.qmd
          text: "About me"
        - href: about/software.qmd
          text: "Software"
        - href: about/publications.qmd
          text: "Publications"
      
    right:
      - text: "<img src='images/Logo_OU_klein.jpg' style='height:22px !important; width:auto !important; max-height:22px !important; vertical-align:middle;' alt='Logo'>"
        href: https://research.ou.nl/en/persons/xynthia-kavelaars/  #
      - icon: github
        href: https://github.com/XynthiaKavelaars  #
      - icon: bluesky  #
        href: https://xynthia-kavelaars.bsky.social  #
      - icon: mastodon  #
        href: https://mastodon.social/@xynthiakavelaars  #
      - icon: linkedin  #
        href: http://www.linkedin.com/in/xynthia-kavelaars-7a0377129  #
      - text: "{{< ai orcid >}}"
        href: https://orcid.org/0000-0003-1600-3153
      - text: "{{< ai researchgate >}}"
        href: https://www.researchgate.net/profile/Xynthia-Kavelaars
      - icon: envelope  #
        href: mailto:xynthia.kavelaars@ou.nl  #
      - icon: rss
